# ── JVM Memory (tuned for JDK 17 — prevents daemon crash) ────────────────────
# -Xmx4G combined with -XX:MaxMetaspaceSize=2G was causing OOM kernel kill.
# Safe values for 8-16 GB machines:
org.gradle.jvmargs=-Xms512m -Xmx2g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=0 -Dfile.encoding=UTF-8

# ── Android ──────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=true
android.enableR8.fullMode=false
android.nonTransitiveRClass=true

# ── Kotlin ───────────────────────────────────────────────────────────────────
kotlin.code.style=official
# Suppress incremental compilation warnings from Kotlin 2.x
kotlin.incremental=true

# ── Gradle Daemon Stability ───────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=true
org.gradle.daemon.idletimeout=3600000
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
